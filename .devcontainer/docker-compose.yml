services:
  mobile-manipulation:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    privileged: true
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_INDIRECT: "0"
    volumes:
      - ..:/workspace:cached
